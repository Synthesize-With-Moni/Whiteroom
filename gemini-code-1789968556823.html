<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#020813">
  <link rel="manifest" href="manifest.json">
  <title>THE SYSTEM</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap');
    
    :root {
      --sys-blue: #00f0ff;
      --sys-dark: #020813;
      --panel-bg: rgba(0, 40, 80, 0.4);
      --border-glow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    body {
      background-color: var(--sys-dark);
      background-image: radial-gradient(circle at top, #051326 0%, #020813 100%);
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      margin: 0; padding: 15px; user-select: none;
      min-height: 100vh;
    }

    /* PLAYER STATUS BOARD */
    .status-board {
      background: var(--panel-bg);
      border: 1px solid var(--sys-blue);
      box-shadow: var(--border-glow);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 25px;
      text-align: left;
      backdrop-filter: blur(5px);
    }
    .status-header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid rgba(0,240,255,0.3); padding-bottom: 5px; margin-bottom: 10px; }
    .player-name { font-size: 2rem; font-weight: 700; letter-spacing: 2px; color: var(--sys-blue); text-shadow: 0 0 8px var(--sys-blue); margin: 0; }
    .player-rank { font-size: 1.2rem; color: #ccc; font-weight: bold; letter-spacing: 1px; }
    .stat-row { display: flex; justify-content: space-between; font-size: 1.2rem; margin-bottom: 5px; font-weight: 500;}
    
    /* XP BAR */
    .xp-container { width: 100%; background: #0a0a0a; border: 1px solid #333; height: 14px; border-radius: 3px; overflow: hidden; margin-top: 8px; box-shadow: inset 0 0 5px #000; }
    .xp-bar { height: 100%; width: 0%; background: var(--sys-blue); box-shadow: 0 0 10px var(--sys-blue); transition: width 0.5s ease-out; }

    /* NOTIFICATION POPUP */
    #notification {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 240, 255, 0.15); border: 1px solid var(--sys-blue);
      color: var(--sys-blue); padding: 10px 25px; border-radius: 4px;
      box-shadow: var(--border-glow); font-size: 1.3rem; font-weight: 700; letter-spacing: 1px;
      opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 1000; text-shadow: 0 0 5px var(--sys-blue);
      backdrop-filter: blur(4px);
    }

    /* QUEST GRID */
    .quest-title { font-size: 1.4rem; font-weight: 700; letter-spacing: 2px; color: #fff; margin-bottom: 10px; text-shadow: 0 0 5px rgba(255,255,255,0.4); text-align: left; border-left: 4px solid var(--sys-blue); padding-left: 10px;}
    table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
    th { font-size: 0.9rem; color: var(--sys-blue); padding-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
    td { background: rgba(0, 20, 40, 0.6); border-top: 1px solid #112; border-bottom: 1px solid #112; padding: 12px 5px; text-align: center; }
    td:first-child { border-left: 1px solid var(--sys-blue); border-top-left-radius: 4px; border-bottom-left-radius: 4px; color: #ccc; font-weight: 700; font-size: 1.1rem; }
    td:last-child { border-right: 1px solid var(--sys-blue); border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
    
    /* GLOWING SYSTEM CHECKBOXES */
    input[type="checkbox"] { appearance: none; width: 26px; height: 26px; border: 1px solid #334; border-radius: 3px; background: #0a0a0a; cursor: pointer; transition: all 0.2s; position: relative; }
    input[type="checkbox"]:checked { background: rgba(0, 240, 255, 0.2); border-color: var(--sys-blue); box-shadow: inset 0 0 8px rgba(0,240,255,0.5), 0 0 8px rgba(0,240,255,0.5); }
    input[type="checkbox"]:checked::after { content: '✔'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--sys-blue); font-size: 18px; text-shadow: 0 0 5px var(--sys-blue); }

    /* LEVEL UP ANIMATION */
    @keyframes levelUpFlash { 0% { box-shadow: inset 0 0 100px rgba(0,240,255,0.8); } 100% { box-shadow: inset 0 0 0px transparent; } }
    .level-up-active { animation: levelUpFlash 1s ease-out; }
  </style>
</head>
<body>
  <div id="notification">QUEST COMPLETE: +15 XP</div>

  <div class="status-board" id="board">
    <div class="status-header">
      <h1 class="player-name">PLAYER</h1>
      <span class="player-rank" id="rankDisplay">E-RANK</span>
    </div>
    <div class="stat-row">
      <span>LEVEL: <strong id="levelDisplay" style="color: var(--sys-blue); font-size: 1.4rem;">1</strong></span>
      <span>XP: <span id="xpText">0 / 100</span></span>
    </div>
    <div class="xp-container"><div class="xp-bar" id="xpBar"></div></div>
  </div>

  <div class="quest-title">DAILY QUESTS // PENALTY: UNKNOWN</div>
  <table id="trackerTable">
    <tr><th>DAY</th><th>C-LOGIC</th><th>NIOS</th><th>DEEP WORK</th><th>GYM</th></tr>
  </table>

  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

    const habits = ['c', 'nios', 'deep', 'gym'];
    const table = document.getElementById('trackerTable');
    let data = JSON.parse(localStorage.getItem('theSystemLedger')) || { checks: {}, xp: 0, level: 1 };
    
    const xpPerTask = 15;
    const baseXpReq = 100;

    function getRank(level) {
      if(level < 5) return 'E-RANK';
      if(level < 10) return 'D-RANK';
      if(level < 20) return 'C-RANK';
      if(level < 30) return 'B-RANK';
      if(level < 40) return 'A-RANK';
      if(level < 50) return 'S-RANK';
      return 'MONARCH';
    }

    function triggerNotification(text) {
      const notif = document.getElementById('notification');
      notif.innerText = text;
      notif.style.opacity = 1;
      setTimeout(() => notif.style.opacity = 0, 1500);
    }

    function calculateLevel() {
      let requiredXp = baseXpReq * data.level;
      if (data.xp >= requiredXp) {
        data.xp -= requiredXp;
        data.level += 1;
        triggerNotification("LEVEL UP! STATS INCREASED.");
        document.body.classList.add('level-up-active');
        setTimeout(() => document.body.classList.remove('level-up-active'), 1000);
      }
      
      document.getElementById('levelDisplay').innerText = data.level;
      document.getElementById('rankDisplay').innerText = getRank(data.level);
      document.getElementById('xpText').innerText = `${data.xp} / ${baseXpReq * data.level}`;
      let xpPercent = (data.xp / (baseXpReq * data.level)) * 100;
      document.getElementById('xpBar').style.width = xpPercent + '%';
      
      localStorage.setItem('theSystemLedger', JSON.stringify(data));
    }

    for(let i = 1; i <= 10; i++) {
      let row = table.insertRow();
      row.insertCell().innerText = (i < 10 ? '0' + i : i);
      habits.forEach(habit => {
        let cell = row.insertCell();
        let cb = document.createElement('input');
        cb.type = 'checkbox';
        let id = habit + '_day' + i;
        cb.checked = data.checks[id] === true;
        
        cb.onclick = (e) => { 
          if (e.target.checked) {
            data.checks[id] = true;
            data.xp += xpPerTask;
            triggerNotification(`QUEST COMPLETE: +${xpPerTask} XP`);
          } else {
            data.checks[id] = false;
            data.xp = Math.max(0, data.xp - xpPerTask);
          }
          calculateLevel(); 
        };
        cell.appendChild(cb);
      });
    }
    calculateLevel();
  </script>
</body>
</html>
