<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#010308">
  <link rel="manifest" href="manifest.json">
  <title>SHADOW MONARCH OS</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap');
    
    :root {
      --sys-cyan: #00f0ff;
      --sys-purple: #9d00ff;
      --sys-dark: #010308;
      --sys-red: #ff003c;
      --panel-bg: rgba(5, 10, 20, 0.65);
      --hex-glow: drop-shadow(0 0 8px rgba(0, 240, 255, 0.6));
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--sys-dark);
      color: #fff; font-family: 'Rajdhani', sans-serif;
      overflow-x: hidden; min-height: 100vh;
      user-select: none; -webkit-tap-highlight-color: transparent;
    }

    /* PARTICLE CANVAS */
    #auraCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; opacity: 0.6; pointer-events: none; }

    /* MAIN CONTAINER */
    .container { padding: 15px; padding-bottom: 80px; max-width: 800px; margin: 0 auto; }

    /* HUD DASHBOARD */
    .hud {
      background: var(--panel-bg); border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 8px; padding: 20px; position: relative;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 15px rgba(0, 240, 255, 0.1);
      margin-bottom: 20px; overflow: hidden;
    }
    
    .hud::before {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: conic-gradient(transparent, rgba(0,240,255,0.1), transparent 30%);
      animation: rotateRadar 6s linear infinite; pointer-events: none; z-index: 0;
    }
    @keyframes rotateRadar { 100% { transform: rotate(360deg); } }

    .hud-content { position: relative; z-index: 1; }
    .header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid rgba(0,240,255,0.2); padding-bottom: 10px; margin-bottom: 15px; }
    .title { font-family: 'Orbitron', sans-serif; font-size: 2rem; font-weight: 900; color: var(--sys-cyan); text-shadow: 0 0 15px var(--sys-cyan); letter-spacing: 3px; line-height: 1;}
    .rank-badge { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 700; padding: 4px 12px; background: rgba(0,240,255,0.1); border: 1px solid var(--sys-cyan); border-radius: 2px; text-shadow: 0 0 8px var(--sys-cyan); box-shadow: 0 0 10px rgba(0,240,255,0.2); transition: all 0.4s ease;}
    
    /* STATS MATRIX */
    .stats-matrix { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 15px; }
    .stat-box { background: rgba(0,0,0,0.5); border: 1px solid #112; padding: 10px; border-radius: 4px; }
    .stat-name { font-size: 0.8rem; color: #8892b0; letter-spacing: 1px; font-weight: 600; display: flex; justify-content: space-between;}
    .stat-val { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; color: #fff; }
    .stat-bar-bg { width: 100%; height: 4px; background: #111; margin-top: 5px; border-radius: 2px; overflow: hidden; }
    .stat-bar-fill { height: 100%; background: var(--sys-cyan); width: 0%; transition: width 1s cubic-bezier(0.22, 1, 0.36, 1); }
    
    /* XP BAR */
    .xp-container { background: rgba(0,0,0,0.6); padding: 10px; border-radius: 4px; border: 1px solid #112; }
    .xp-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: #8892b0; font-weight: 700; margin-bottom: 5px; letter-spacing: 1px;}
    .xp-track { width: 100%; height: 12px; background: #050a14; border-radius: 6px; box-shadow: inset 0 0 5px #000; overflow: hidden; position: relative;}
    .xp-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--sys-purple), var(--sys-cyan)); box-shadow: 0 0 15px var(--sys-cyan); transition: width 0.8s ease-out; }

    /* HEX GRID CALIBRATION */
    .grid-title { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; margin: 20px 0 10px 0; color: #fff; border-left: 4px solid var(--sys-cyan); padding-left: 10px; letter-spacing: 2px; text-shadow: 0 0 5px rgba(255,255,255,0.3);}
    .day-row { background: var(--panel-bg); border: 1px solid #112; margin-bottom: 12px; border-radius: 6px; padding: 15px; transition: all 0.3s ease; position: relative; overflow: hidden;}
    .day-row.active { border-color: rgba(0,240,255,0.4); box-shadow: inset 0 0 20px rgba(0,240,255,0.05); }
    .day-row.cleared { border-color: var(--sys-purple); background: rgba(157, 0, 255, 0.05); }
    .day-row.locked { opacity: 0.35; pointer-events: none; border-color: var(--sys-red); filter: grayscale(80%); }

    .day-header { display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: 700; color: #e2e8f0; margin-bottom: 15px; letter-spacing: 1px; }
    .day-status { font-size: 0.85rem; font-family: 'Orbitron', sans-serif; letter-spacing: 2px; }
    .cleared .day-status { color: var(--sys-purple); text-shadow: 0 0 10px var(--sys-purple); }
    .locked .day-status { color: var(--sys-red); }

    .nodes-container { display: flex; justify-content: space-between; align-items: center; }
    .node-wrapper { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 18%; }
    
    /* HEXAGON CHECKBOX */
    .hex-node {
      width: 40px; height: 45px; background: #050a14;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex; justify-content: center; align-items: center;
      cursor: pointer; transition: all 0.3s; border: 2px solid #1e293b;
    }
    .hex-inner {
      width: 32px; height: 36px; background: #0a1122;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      transition: all 0.3s; display: flex; justify-content: center; align-items: center;
    }
    .node-label { font-size: 0.6rem; color: #64748b; font-weight: 700; text-align: center; text-transform: uppercase; letter-spacing: 0.5px; line-height: 1.1; }
    
    /* Node States */
    .node-wrapper.checked .hex-node { background: var(--sys-cyan); filter: var(--hex-glow); }
    .node-wrapper.checked .hex-inner { background: var(--sys-cyan); }
    .node-wrapper.checked .hex-inner::after { content: ''; width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px #fff; }
    .node-wrapper.checked .node-label { color: var(--sys-cyan); text-shadow: 0 0 5px rgba(0,240,255,0.5); }

    /* SYSTEM TERMINAL (NOTIFICATIONS) */
    #sysTerminal {
      position: fixed; top: 15px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: rgba(0, 5, 10, 0.95); border: 1px solid var(--sys-cyan); color: var(--sys-cyan);
      padding: 12px 25px; font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: 700;
      border-radius: 4px; box-shadow: 0 0 20px rgba(0,240,255,0.3); z-index: 1000;
      opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      letter-spacing: 1px; text-transform: uppercase; white-space: nowrap;
    }

    /* DATA MANAGEMENT */
    .data-controls { display: flex; gap: 10px; margin-top: 20px; }
    .btn { flex: 1; background: transparent; border: 1px solid #334155; color: #94a3b8; padding: 12px; font-family: 'Rajdhani', sans-serif; font-size: 1rem; font-weight: 700; letter-spacing: 1px; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
    .btn:hover { border-color: var(--sys-cyan); color: var(--sys-cyan); }
    #dataIO { width: 100%; background: #050a14; border: 1px solid #334155; color: var(--sys-cyan); padding: 10px; margin-top: 10px; border-radius: 4px; font-family: monospace; font-size: 0.8rem; display: none; word-wrap: break-word;}

    /* WINTER ARC OVERRIDE */
    #ariseSequence {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
      opacity: 0; pointer-events: none; transition: opacity 2s ease-in;
    }
    .arise-text {
      font-family: 'Orbitron', sans-serif; font-size: 4rem; font-weight: 900;
      color: var(--sys-purple); text-shadow: 0 0 30px var(--sys-purple), 0 0 60px var(--sys-purple);
      letter-spacing: 10px; transform: scale(0.5); opacity: 0; transition: all 3s cubic-bezier(0.075, 0.82, 0.165, 1);
    }
    .arise-sub { color: #fff; font-size: 1.2rem; letter-spacing: 5px; opacity: 0; transition: opacity 2s ease; margin-top: 20px;}

    /* GLITCH EFFECT */
    .glitch { animation: glitch 0.2s linear infinite; color: var(--sys-red); border-color: var(--sys-red); }
    @keyframes glitch { 
      0% { transform: translate(0) } 
      20% { transform: translate(-2px, 1px) } 
      40% { transform: translate(-1px, -1px) } 
      60% { transform: translate(2px, 1px) } 
      80% { transform: translate(1px, -1px) } 
      100% { transform: translate(0) } 
    }
  </style>
</head>
<body>
  
  <canvas id="auraCanvas"></canvas>
  <div id="sysTerminal">SYSTEM LOG</div>

  <div class="container">
    <!-- HUD -->
    <div class="hud">
      <div class="hud-content">
        <div class="header">
          <h1 class="title">PLAYER</h1>
          <div class="rank-badge" id="rankBadge">E-RANK</div>
        </div>

        <div class="stats-matrix">
          <div class="stat-box">
            <div class="stat-name"><span>INT</span> <span class="stat-val" id="stat-int">10</span></div>
            <div class="stat-bar-bg"><div class="stat-bar-fill" id="bar-int"></div></div>
          </div>
          <div class="stat-box">
            <div class="stat-name"><span>PER</span> <span class="stat-val" id="stat-per">10</span></div>
            <div class="stat-bar-bg"><div class="stat-bar-fill" id="bar-per"></div></div>
          </div>
          <div class="stat-box">
            <div class="stat-name"><span>WIL</span> <span class="stat-val" id="stat-wil">10</span></div>
            <div class="stat-bar-bg"><div class="stat-bar-fill" id="bar-wil"></div></div>
          </div>
          <div class="stat-box">
            <div class="stat-name"><span>STR</span> <span class="stat-val" id="stat-str">10</span></div>
            <div class="stat-bar-bg"><div class="stat-bar-fill" id="bar-str"></div></div>
          </div>
          <div class="stat-box" style="grid-column: span 2;">
            <div class="stat-name"><span>FOC</span> <span class="stat-val" id="stat-foc">10</span></div>
            <div class="stat-bar-bg"><div class="stat-bar-fill" id="bar-foc"></div></div>
          </div>
        </div>

        <div class="xp-container">
          <div class="xp-header">
            <span>LEVEL <span id="levelDisplay" style="color: var(--sys-cyan); font-size: 1.2rem; font-family: 'Orbitron';">1</span></span>
            <span id="xpText">0 / 100</span>
          </div>
          <div class="xp-track"><div class="xp-fill" id="xpBar"></div></div>
        </div>
      </div>
    </div>

    <div class="grid-title">CALIBRATION PROTOCOL</div>
    <div id="gridContainer"></div>

    <div class="data-controls">
      <button class="btn" onclick="exportData()">EXPORT SAVE</button>
      <button class="btn" onclick="importData()">IMPORT SAVE</button>
    </div>
    <textarea id="dataIO" rows="3" placeholder="Paste save code here..."></textarea>
  </div>

  <div id="ariseSequence">
    <div class="arise-text" id="ariseTxt">ARISE</div>
    <div class="arise-sub" id="ariseSub">WINTER ARC PROTOCOL INITIATED</div>
  </div>

  <script>
    // --- PARTICLE AURA ENGINE ---
    const canvas = document.getElementById('auraCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    let particles = [];

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5 - 0.5; // Float upwards
        this.size = Math.random() * 2 + 1;
        this.life = Math.random() * 0.5 + 0.2;
        this.color = Math.random() > 0.5 ? 'rgba(0, 240, 255,' : 'rgba(157, 0, 255,';
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        if(this.y < 0) this.y = height;
        if(this.x < 0) this.x = width;
        if(this.x > width) this.x = 0;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color + this.life + ')';
        ctx.fill();
      }
    }
    for(let i=0; i<80; i++) particles.push(new Particle());
    function animate() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();
    window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });

    // --- SHADOW MONARCH OS LOGIC ---
    const tasks = [
      { id: 'int', name: 'CS50x' },
      { id: 'per', name: 'NIOS' },
      { id: 'wil', name: 'READ 10+' },
      { id: 'str', name: 'GYM' },
      { id: 'foc', name: 'DEEP WK' }
    ];
    const totalDays = 10;
    
    // Core State Object
    let state = JSON.parse(localStorage.getItem('monarchOS_v2')) || {
      grid: Array(totalDays * 5).fill(false),
      stats: { int: 10, per: 10, wil: 10, str: 10, foc: 10 },
      xp: 0, level: 1
    };

    function sysPrint(msg, isError = false) {
      const term = document.getElementById('sysTerminal');
      term.innerText = msg;
      term.style.color = isError ? 'var(--sys-red)' : 'var(--sys-cyan)';
      term.style.borderColor = isError ? 'var(--sys-red)' : 'var(--sys-cyan)';
      if(isError) term.classList.add('glitch');
      
      term.style.opacity = '1';
      term.style.transform = 'translateX(-50%) translateY(0)';
      
      setTimeout(() => {
        term.style.opacity = '0';
        term.style.transform = 'translateX(-50%) translateY(-20px)';
        term.classList.remove('glitch');
      }, 2000);
    }

    function initGrid() {
      const container = document.getElementById('gridContainer');
      container.innerHTML = '';
      
      for(let d = 0; d < totalDays; d++) {
        let row = document.createElement('div');
        row.className = 'day-row';
        row.id = `day-${d}`;
        
        let header = document.createElement('div');
        header.className = 'day-header';
        header.innerHTML = `<span>DAY ${d < 9 ? '0'+(d+1) : (d+1)}</span> <span class="day-status" id="status-${d}">LOCKED</span>`;
        row.appendChild(header);

        let nodesContainer = document.createElement('div');
        nodesContainer.className = 'nodes-container';

        for(let t = 0; t < 5; t++) {
          let globalIdx = (d * 5) + t;
          let nodeWrap = document.createElement('div');
          nodeWrap.className = 'node-wrapper';
          if(state.grid[globalIdx]) nodeWrap.classList.add('checked');
          
          nodeWrap.innerHTML = `
            <div class="hex-node"><div class="hex-inner"></div></div>
            <div class="node-label">${tasks[t].name}</div>
          `;
          
          nodeWrap.onclick = () => handleNodeClick(d, globalIdx, t, nodeWrap);
          nodesContainer.appendChild(nodeWrap);
        }
        row.appendChild(nodesContainer);
        container.appendChild(row);
      }
      calcSystem();
    }

    function handleNodeClick(dayIdx, globalIdx, taskTypeIdx, el) {
      // Sequential Lock Logic
      if (dayIdx > 0) {
        let prevDayCleared = true;
        for(let i = (dayIdx-1)*5; i < dayIdx*5; i++) {
          if(!state.grid[i]) prevDayCleared = false;
        }
        if(!prevDayCleared) {
          sysPrint("SYSTEM DENIED: CLEAR PREVIOUS DAY", true);
          document.getElementById(`day-${dayIdx-1}`).style.borderColor = "var(--sys-red)";
          setTimeout(() => document.getElementById(`day-${dayIdx-1}`).style.borderColor = "", 500);
          return;
        }
      }

      const statKey = tasks[taskTypeIdx].id;
      
      if(!state.grid[globalIdx]) {
        state.grid[globalIdx] = true;
        state.stats[statKey] += 2;
        state.xp += 50;
        el.classList.add('checked');
        sysPrint(`+50 XP | ${statKey.toUpperCase()} +2`);
      } else {
        state.grid[globalIdx] = false;
        state.stats[statKey] = Math.max(10, state.stats[statKey] - 2);
        state.xp = Math.max(0, state.xp - 50);
        el.classList.remove('checked');
      }
      
      saveState();
      calcSystem();
    }

    function calcSystem() {
      let daysCleared = 0;

      // Eval Matrix UI
      for(let d = 0; d < totalDays; d++) {
        let row = document.getElementById(`day-${d}`);
        let status = document.getElementById(`status-${d}`);
        
        let completed = 0;
        for(let i = d*5; i < (d+1)*5; i++) { if(state.grid[i]) completed++; }

        let isLocked = false;
        if(d > 0) {
          let prevComp = 0;
          for(let i = (d-1)*5; i < d*5; i++) { if(state.grid[i]) prevComp++; }
          if(prevComp < 5) isLocked = true;
        }

        row.className = 'day-row'; 
        if (completed === 5) {
          row.classList.add('cleared'); status.innerText = "SYNCHRONIZED"; daysCleared++;
        } else if (isLocked) {
          row.classList.add('locked'); status.innerText = "LOCKED";
        } else {
          row.classList.add('active'); status.innerText = "CALIBRATING..."; status.style.color = "var(--sys-cyan)";
        }
      }

      // Level Math
      let curLvl = Math.floor(Math.sqrt(state.xp / 10)) + 1;
      if(curLvl > state.level) {
        state.level = curLvl;
        sysPrint("LEVEL UP", false);
        document.querySelector('.hud').style.boxShadow = "inset 0 0 50px rgba(0,240,255,0.8)";
        setTimeout(() => document.querySelector('.hud').style.boxShadow = "", 500);
      } else {
        state.level = curLvl;
      }
      
      let nextXP = Math.pow(state.level, 2) * 10;
      let prevXP = Math.pow(state.level - 1, 2) * 10;
      let xpPercent = ((state.xp - prevXP) / (nextXP - prevXP)) * 100;

      document.getElementById('levelDisplay').innerText = state.level;
      document.getElementById('xpText').innerText = `${state.xp} / ${nextXP}`;
      document.getElementById('xpBar').style.width = xpPercent + '%';

      // Ranks
      let rb = document.getElementById('rankBadge');
      rb.style.color = "var(--sys-cyan)"; rb.style.borderColor = "var(--sys-cyan)"; rb.style.boxShadow = "0 0 10px rgba(0,240,255,0.2)";
      if (daysCleared === 10) { rb.innerText = 'MONARCH'; rb.style.color = "var(--sys-purple)"; rb.style.borderColor = "var(--sys-purple)"; }
      else if (state.level >= 40) { rb.innerText = 'S-RANK'; rb.style.color = "#ff003c"; rb.style.borderColor = "#ff003c"; }
      else if (state.level >= 30) { rb.innerText = 'A-RANK'; }
      else if (state.level >= 20) { rb.innerText = 'B-RANK'; }
      else if (state.level >= 10) { rb.innerText = 'C-RANK'; }
      else if (state.level >= 5) { rb.innerText = 'D-RANK'; }
      else { rb.innerText = 'E-RANK'; }

      // Update Stats
      ['int','per','wil','str','foc'].forEach(s => {
        document.getElementById(`stat-${s}`).innerText = state.stats[s];
        // Visual bar scales up to stat level 30 for max fill
        let fill = Math.min((state.stats[s] / 30) * 100, 100);
        document.getElementById(`bar-${s}`).style.width = fill + '%';
      });

      // Arise Sequence
      if(daysCleared === 10) {
        setTimeout(() => {
          document.getElementById('ariseSequence').style.opacity = '1';
          document.getElementById('ariseSequence').style.pointerEvents = 'auto';
          setTimeout(() => {
            document.getElementById('ariseTxt').style.opacity = '1';
            document.getElementById('ariseTxt').style.transform = 'scale(1)';
          }, 500);
          setTimeout(() => { document.getElementById('ariseSub').style.opacity = '1'; }, 2000);
        }, 800);
      }
    }

    function saveState() { localStorage.setItem('monarchOS_v2', JSON.stringify(state)); }

    // CRYPTO SAVE/LOAD
    const ioBox = document.getElementById('dataIO');
    function exportData() {
      ioBox.style.display = 'block';
      ioBox.value = btoa(JSON.stringify(state));
      ioBox.select();
      document.execCommand('copy');
      sysPrint("SAVE CODE COPIED TO CLIPBOARD");
    }
    function importData() {
      ioBox.style.display = 'block';
      if(ioBox.value.trim() === '') { sysPrint("PASTE CODE FIRST", true); return; }
      try {
        let decoded = JSON.parse(atob(ioBox.value));
        if(decoded.grid && decoded.stats) {
          state = decoded;
          saveState();
          initGrid();
          sysPrint("SYSTEM RESTORED");
          ioBox.style.display = 'none';
        } else throw new Error();
      } catch(e) {
        sysPrint("INVALID OVERRIDE CODE", true);
      }
    }

    initGrid();
  </script>
</body>
</html>
