<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#030712">
  <link rel="manifest" href="manifest.json">
  <title>THE SYSTEM // LEVEL 100</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');
    
    :root {
      --cyan: #00f0ff;
      --cyan-dim: rgba(0, 240, 255, 0.1);
      --red: #ff003c;
      --purple: #b026ff;
      --bg-dark: #030712;
      --panel-bg: rgba(3, 11, 24, 0.7);
    }

    * { box-sizing: border-box; }
    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, #0a192f 0%, transparent 50%),
        linear-gradient(0deg, rgba(0,240,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px);
      background-size: 100% 100%, 20px 20px, 20px 20px;
      color: #fff; font-family: 'Rajdhani', sans-serif;
      margin: 0; padding: 10px; user-select: none; min-height: 100vh;
      overflow-x: hidden;
    }

    /* STATUS DASHBOARD */
    .dashboard {
      background: var(--panel-bg);
      border: 1px solid var(--cyan);
      box-shadow: 0 0 15px var(--cyan-dim), inset 0 0 20px var(--cyan-dim);
      border-radius: 4px; padding: 15px; margin-bottom: 20px;
      position: relative; overflow: hidden;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
    }
    .dashboard::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0,240,255,0.2), transparent);
      animation: scanline 4s infinite linear;
    }
    @keyframes scanline { 100% { left: 200%; } }

    .header-top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid rgba(0,240,255,0.3); padding-bottom: 8px; margin-bottom: 12px; }
    .player-title { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 900; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); margin: 0; letter-spacing: 2px;}
    .rank-badge { font-size: 1.2rem; font-weight: 700; padding: 2px 10px; border: 1px solid var(--cyan); background: rgba(0,240,255,0.1); border-radius: 3px; letter-spacing: 1px; transition: all 0.5s;}
    
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 1.1rem; }
    .stat-label { color: #8892b0; font-size: 0.9rem; letter-spacing: 1px; }
    .stat-value { font-size: 1.5rem; font-weight: 700; font-family: 'Orbitron', sans-serif; }

    /* XP BAR */
    .xp-wrapper { margin-top: 15px; }
    .xp-track { width: 100%; background: #0f172a; border: 1px solid #1e293b; height: 12px; border-radius: 2px; position: relative; overflow: hidden; }
    .xp-fill { height: 100%; width: 0%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
    
    /* QUEST MATRIX */
    .matrix-title { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: #fff; margin-bottom: 10px; border-left: 3px solid var(--cyan); padding-left: 8px; letter-spacing: 1px; }
    .day-card {
      background: rgba(10, 20, 35, 0.8);
      border: 1px solid #1e293b;
      margin-bottom: 10px; padding: 12px;
      border-radius: 4px; transition: all 0.3s;
      position: relative;
    }
    .day-card.active { border-color: var(--cyan); box-shadow: inset 0 0 15px rgba(0,240,255,0.05); }
    .day-card.locked { opacity: 0.4; pointer-events: none; border-color: var(--red); background: rgba(255,0,60,0.02); }
    .day-card.cleared { border-color: #00ff66; background: rgba(0,255,102,0.05); }

    .day-header { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; color: #e2e8f0; }
    .day-status { font-size: 0.9rem; letter-spacing: 1px; }
    .locked .day-status { color: var(--red); }
    .cleared .day-status { color: #00ff66; text-shadow: 0 0 5px #00ff66; }

    .task-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
    .task-item {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0f172a; border: 1px solid #334155; padding: 8px 2px; border-radius: 3px; cursor: pointer; transition: all 0.2s;
    }
    .task-label { font-size: 0.65rem; color: #94a3b8; margin-top: 5px; text-transform: uppercase; font-weight: 700; text-align: center; line-height: 1; }
    .task-box { width: 22px; height: 22px; border: 1px solid #475569; background: #030712; border-radius: 2px; position: relative; transition: all 0.2s; }
    
    /* Clicked State */
    .task-item.checked { background: rgba(0,240,255,0.1); border-color: var(--cyan); }
    .task-item.checked .task-box { background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
    .task-item.checked .task-label { color: var(--cyan); }

    /* POPUP NOTIFICATION */
    #notif {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: rgba(0,0,0,0.9); border: 1px solid var(--cyan); color: var(--cyan);
      padding: 12px 20px; font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 700;
      border-radius: 4px; box-shadow: 0 0 15px var(--cyan-dim); z-index: 1000;
      opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* WINTER ARC OVERRIDE MODAL */
    #winterArcModal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.95); z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      opacity: 0; pointer-events: none; transition: opacity 1s ease-in;
    }
    .winter-text {
      font-family: 'Orbitron', sans-serif; font-size: 3rem; font-weight: 900;
      color: var(--cyan); text-shadow: 0 0 20px var(--cyan), 0 0 40px var(--cyan);
      text-align: center; line-height: 1.2; letter-spacing: 5px;
      transform: scale(0.8); transition: transform 2s cubic-bezier(0.075, 0.82, 0.165, 1);
    }
    .winter-sub { color: #fff; font-size: 1.2rem; margin-top: 20px; letter-spacing: 3px; font-family: 'Rajdhani', sans-serif; }
    
    /* Rank Specific Colors */
    .rank-S { color: #eab308; border-color: #eab308; text-shadow: 0 0 10px #eab308; box-shadow: inset 0 0 10px rgba(234,179,8,0.2); }
    .rank-M { color: var(--purple); border-color: var(--purple); text-shadow: 0 0 15px var(--purple); box-shadow: inset 0 0 20px rgba(176,38,255,0.3); background: rgba(176,38,255,0.1); }
  </style>
</head>
<body>

  <div id="notif">XP ACQUIRED</div>

  <!-- DASHBOARD -->
  <div class="dashboard">
    <div class="header-top">
      <h1 class="player-title">PLAYER</h1>
      <div class="rank-badge" id="rankBadge">E-RANK</div>
    </div>
    <div class="stats-grid">
      <div>
        <div class="stat-label">LEVEL</div>
        <div class="stat-value" id="levelDisplay" style="color: var(--cyan);">1</div>
      </div>
      <div style="text-align: right;">
        <div class="stat-label">SHADOW PROGRESS</div>
        <div class="stat-value"><span id="daysCleared">0</span><span style="font-size: 1rem; color: #8892b0;">/10</span></div>
      </div>
    </div>
    <div class="xp-wrapper">
      <div class="header-top" style="border: none; padding: 0; margin-bottom: 5px;">
        <span class="stat-label">EXPERIENCE</span>
        <span class="stat-label" id="xpCounter">0 / 500</span>
      </div>
      <div class="xp-track"><div class="xp-fill" id="xpBar"></div></div>
    </div>
  </div>

  <div class="matrix-title">CALIBRATION MATRIX // 10 DAYS</div>
  <div id="matrixContainer"></div>

  <!-- WINTER ARC FINAL MODAL -->
  <div id="winterArcModal">
    <div class="winter-text" id="wt">CALIBRATION<br>COMPLETE</div>
    <div class="winter-sub">WINTER ARC PROTOCOL UNLOCKED</div>
  </div>

  <script>
    // Config
    const taskNames = ['CS50x', 'NIOS', 'READ 10+', 'GYM', 'DEEP WK'];
    const totalDays = 10;
    const tasksPerDay = 5;
    const totalTasks = totalDays * tasksPerDay;
    
    // State Management (Flat array of 50 booleans)
    let state = JSON.parse(localStorage.getItem('shadowMonarchState')) || Array(totalTasks).fill(false);

    // Initialization
    const matrix = document.getElementById('matrixContainer');
    
    function initMatrix() {
      matrix.innerHTML = '';
      for(let d = 0; d < totalDays; d++) {
        let card = document.createElement('div');
        card.className = 'day-card';
        card.id = `day-${d}`;
        
        let header = document.createElement('div');
        header.className = 'day-header';
        header.innerHTML = `<span>DAY ${d < 9 ? '0'+(d+1) : (d+1)}</span> <span class="day-status" id="status-${d}">LOCKED</span>`;
        card.appendChild(header);

        let grid = document.createElement('div');
        grid.className = 'task-grid';

        for(let t = 0; t < tasksPerDay; t++) {
          let globalIndex = (d * tasksPerDay) + t;
          let item = document.createElement('div');
          item.className = 'task-item';
          if(state[globalIndex]) item.classList.add('checked');
          
          item.innerHTML = `<div class="task-box"></div><div class="task-label">${taskNames[t]}</div>`;
          
          item.onclick = () => handleTaskClick(d, globalIndex, item);
          grid.appendChild(item);
        }
        card.appendChild(grid);
        matrix.appendChild(card);
      }
      calculateSystem();
    }

    function showNotif(msg, color) {
      const n = document.getElementById('notif');
      n.innerText = msg;
      n.style.color = color || 'var(--cyan)';
      n.style.borderColor = color || 'var(--cyan)';
      n.style.transform = 'translateX(-50%) translateY(0)';
      n.style.opacity = '1';
      setTimeout(() => {
        n.style.opacity = '0';
        n.style.transform = 'translateX(-50%) translateY(-20px)';
      }, 2000);
    }

    function handleTaskClick(dayIndex, globalIndex, el) {
      // Logic: Prevent clicking if previous day is not fully cleared
      if (dayIndex > 0) {
        let prevDayCleared = true;
        for(let i = (dayIndex-1)*tasksPerDay; i < dayIndex*tasksPerDay; i++) {
          if(!state[i]) prevDayCleared = false;
        }
        if(!prevDayCleared) {
          showNotif("ERROR: CLEAR PREVIOUS DAY FIRST", "var(--red)");
          return;
        }
      }

      // Toggle state
      state[globalIndex] = !state[globalIndex];
      if(state[globalIndex]) {
        el.classList.add('checked');
        showNotif("+50 XP ACQUIRED", "var(--cyan)");
      } else {
        el.classList.remove('checked');
      }
      
      localStorage.setItem('shadowMonarchState', JSON.stringify(state));
      calculateSystem();
    }

    function calculateSystem() {
      let completedTasks = state.filter(Boolean).length;
      let daysCleared = 0;

      // Update Card UI States
      for(let d = 0; d < totalDays; d++) {
        let card = document.getElementById(`day-${d}`);
        let status = document.getElementById(`status-${d}`);
        
        let dayTasksCompleted = 0;
        for(let i = d*tasksPerDay; i < (d+1)*tasksPerDay; i++) {
          if(state[i]) dayTasksCompleted++;
        }

        // Determine if Locked, Active, or Cleared
        let isLocked = false;
        if(d > 0) {
          let prevDayCompleted = 0;
          for(let i = (d-1)*tasksPerDay; i < d*tasksPerDay; i++) {
            if(state[i]) prevDayCompleted++;
          }
          if(prevDayCompleted < tasksPerDay) isLocked = true;
        }

        card.className = 'day-card'; // reset
        if (dayTasksCompleted === tasksPerDay) {
          card.classList.add('cleared');
          status.innerText = "CLEARED";
          daysCleared++;
        } else if (isLocked) {
          card.classList.add('locked');
          status.innerText = "LOCKED";
        } else {
          card.classList.add('active');
          status.innerText = "IN PROGRESS";
          status.style.color = "var(--cyan)";
        }
      }

      // Math for Leveling
      let totalXP = completedTasks * 50 + (daysCleared * 200); // 50 per task, 200 bonus per cleared day
      let currentLevel = Math.floor(Math.sqrt(totalXP / 10)) + 1; // Exp curve
      if (completedTasks === 0) currentLevel = 1;
      
      let nextLevelXP = Math.pow(currentLevel, 2) * 10;
      let prevLevelXP = Math.pow(currentLevel - 1, 2) * 10;
      let levelProgress = totalXP - prevLevelXP;
      let levelRange = nextLevelXP - prevLevelXP;
      let percentage = (levelProgress / levelRange) * 100;

      // Update Dashboard
      document.getElementById('levelDisplay').innerText = currentLevel;
      document.getElementById('daysCleared').innerText = daysCleared;
      document.getElementById('xpCounter').innerText = `${totalXP} / ${nextLevelXP}`;
      document.getElementById('xpBar').style.width = percentage + '%';

      // Rank System
      let rankBadge = document.getElementById('rankBadge');
      rankBadge.className = 'rank-badge'; // reset
      if (currentLevel >= 50 || daysCleared === 10) { rankBadge.innerText = 'MONARCH'; rankBadge.classList.add('rank-M'); }
      else if (currentLevel >= 40) { rankBadge.innerText = 'S-RANK'; rankBadge.classList.add('rank-S'); }
      else if (currentLevel >= 30) { rankBadge.innerText = 'A-RANK'; }
      else if (currentLevel >= 20) { rankBadge.innerText = 'B-RANK'; }
      else if (currentLevel >= 10) { rankBadge.innerText = 'C-RANK'; }
      else if (currentLevel >= 5) { rankBadge.innerText = 'D-RANK'; }
      else { rankBadge.innerText = 'E-RANK'; }

      // WINTER ARC OVERRIDE
      if (daysCleared === 10) {
        setTimeout(() => {
          let modal = document.getElementById('winterArcModal');
          modal.style.opacity = '1';
          modal.style.pointerEvents = 'auto';
          document.getElementById('wt').style.transform = 'scale(1)';
        }, 1000);
      }
    }

    // Boot System
    initMatrix();
  </script>
</body>
</html>
